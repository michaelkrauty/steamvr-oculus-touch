[package]
name = "cv1touch"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
repository = "https://github.com/michaelkrauty/steamvr-oculus-touch"
readme = "README.md"
description = "SteamVR Oculus Touch: Rift CV1 controller tracking daemon and tools"

[features]
default = ["engine"]
# The native acquisition engine (OpenHMD, OpenCV): built and linked by build.rs. Without it the
# library's tracking, calibration and protocol code still builds and tests on any platform.
engine = []

[[bin]]
name = "cv1touch"
path = "src/bin/cv1touch.rs"
required-features = ["engine"]

[[bin]]
name = "cv1touchd"
path = "src/bin/cv1touchd.rs"
required-features = ["engine"]

[dependencies]
libc = "0.2"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
bindgen = "0.72"

# The calibration tests run bundle adjustment on synthetic rooms; unoptimised nalgebra is ~50x slower.
[profile.test]
opt-level = 2
