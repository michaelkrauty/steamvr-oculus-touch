[package]
name = "cv1touch"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
repository = "https://github.com/michaelkrauty/steamvr-oculus-touch"
readme = "README.md"
description = "SteamVR Oculus Touch: Rift CV1 controller tracking daemon and tools"

[dependencies]
libc = "0.2"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[build-dependencies]
bindgen = "0.72"

# The calibration tests run bundle adjustment on synthetic rooms; unoptimised nalgebra is ~50x slower.
[profile.test]
opt-level = 2
