[package]
name = "cv1touch-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
