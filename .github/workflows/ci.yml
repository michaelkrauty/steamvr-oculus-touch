name: Linux checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Fork PRs must pass GitHub's server-side approval gate before this job starts.
    # These conditions select jobs; they cannot replace that repository setting.
    if: >-
      github.repository == 'michaelkrauty/steamvr-oculus-touch' &&
      (
        (github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
            (github.event.pull_request.user.login == 'michaelkrauty' && github.actor == 'michaelkrauty'))) ||
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == 'michaelkrauty')
      )
    runs-on: [self-hosted, Linux, X64, steamvr-oculus-touch]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rust: ["1.85.0", stable]
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify preinstalled native dependencies
        run: |
          for tool in meson ninja clang pkg-config python3; do command -v "$tool"; done
          pkg-config --exists hidapi-hidraw libusb-1.0 opencv4 libjpeg libpipewire-0.3 libspa-0.2
      - name: Install Rust toolchain for this job
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Build and test
        run: scripts/check.sh

  check-hosted:
    # Fork owners can run checks in their own repositories without a private runner.
    if: github.repository != 'michaelkrauty/steamvr-oculus-touch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", stable]
    env:
      CARGO_BUILD_JOBS: "4"
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config meson ninja-build clang libclang-dev libhidapi-dev libusb-1.0-0-dev libopencv-dev libjpeg-dev libpipewire-0.3-dev libspa-0.2-dev
      - name: Install Rust toolchain for this job
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Build and test
        run: scripts/check.sh
