name: Windows checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  library:
    # The library without the native engine on GitHub's isolated Windows runners: the platform
    # layer and the tracking, calibration and protocol code, on the oldest supported Rust too.
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain for this job
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy
      - name: Lint
        run: cargo clippy --locked --no-default-features --lib --tests -- -D warnings
      # the daemon and the tool need the engine to link, not to type-check
      - name: Lint the daemon and the tool
        env:
          CV1TOUCH_CHECK_ONLY: "1"
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --no-default-features --lib
  driver:
    # The SteamVR driver DLL (clang-cl, static runtime) and its tests, then the driver against the
    # daemon's own shared-memory and control code.
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CC: clang-cl
      CXX: clang-cl
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install meson and ninja
        run: |
          python -m pip install --disable-pip-version-check "meson==1.8.2" "ninja==1.11.1.4"
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build
        run: |
          meson setup build-driver --vsenv
          meson compile -C build-driver
      - name: Test
        run: meson test -C build-driver --print-errorlogs
      - name: Contract with the daemon
        run: cargo run --locked --no-default-features --example driver_contract -- build-driver\driver\test_daemon_contract.exe
  engine:
    # The native engine on the maintainer's persistent Windows runner, whose vcpkg binary cache
    # keeps OpenCV built between runs; Rust, LLVM, Python with meson and vcpkg are preinstalled.
    # Fork PRs must pass GitHub's server-side approval gate before this job starts. These
    # conditions select jobs; they cannot replace that repository setting. Pull requests only
    # read the binary cache; pushes to main also write it.
    if: >-
      github.repository == 'michaelkrauty/steamvr-oculus-touch' &&
      (
        (github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
            (github.event.pull_request.user.login == 'michaelkrauty' && github.actor == 'michaelkrauty'))) ||
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == 'michaelkrauty')
      )
    runs-on: [self-hosted, Windows, steamvr-oculus-touch]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rust: ["1.85.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTUP_HOME: C:\rust\rustup
      CARGO_HOME: C:\rust\cargo
      CV1TOUCH_DEPS: ${{ github.workspace }}\vcpkg_installed\x64-windows-cv1touch
      VCPKG_BINARY_SOURCES: ${{ github.event_name == 'push' && 'clear;files,C:\vcpkg-cache,readwrite' || 'clear;files,C:\vcpkg-cache,read' }}
      VCPKG_DISABLE_METRICS: "1"
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the preinstalled tools
        run: |
          "C:\Python312", "C:\Python312\Scripts", "C:\Program Files\LLVM\bin", "$env:CARGO_HOME\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Verify the preinstalled tools
        run: foreach ($tool in "meson", "ninja", "clang-cl", "rustup", "C:\vcpkg\vcpkg.exe") { (Get-Command $tool).Source }
      - name: Install Rust toolchain for this job
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy
      - name: Dependencies
        run: C:\vcpkg\vcpkg.exe install --x-manifest-root=. --overlay-triplets=windows\triplets --triplet x64-windows-cv1touch --x-install-root=vcpkg_installed
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --lib --bins
      - name: Engine tests
        run: meson test -C (Get-Content target\debug\cv1touch-native-dir) --print-errorlogs
      # What a release ships: the bundle the installer job packs.
      - name: Release build
        if: matrix.rust == 'stable'
        run: cargo build --locked --release --bins
      - name: Bundle
        if: matrix.rust == 'stable'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows\bundle.ps1 -Target target -Out target\bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.rust == 'stable'
        with:
          name: cv1touch-windows-bundle
          path: target/bundle
          if-no-files-found: error
          retention-days: 14
  installer:
    # The installer, packed on GitHub's runner from the bundle the engine job built; Inno Setup
    # is preinstalled there. The runner has none of the build's libraries, so running the bundle
    # and then installing and uninstalling it silently show that it is complete. Skipped with the
    # engine job.
    needs: engine
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cv1touch-windows-bundle
          path: target/bundle
      - name: The bundle runs without the build's libraries
        run: |
          & target\bundle\bin\cv1touchd.exe --version
          if ($LASTEXITCODE -ne 0) { throw "cv1touchd exit $LASTEXITCODE" }
          & target\bundle\bin\cv1touch.exe --version
          if ($LASTEXITCODE -ne 0) { throw "cv1touch exit $LASTEXITCODE" }
      - name: Pack
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "tag $env:GITHUB_REF_NAME, but Cargo.toml says $version" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" "/DBundle=$PWD\target\bundle" windows\installer\cv1touch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exit $LASTEXITCODE" }
      - name: Install and uninstall silently
        run: |
          $setup = (Get-Item target\installer\cv1touch-setup-*.exe).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=setup.log' -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup exit $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\cv1touch"
          & "$app\bin\cv1touch.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed cv1touch exit $LASTEXITCODE" }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').cv1touch) { throw 'no Run entry' }
          Start-Sleep 5
          if (-not (Get-Process cv1touchd -ErrorAction SilentlyContinue)) { Get-Content "$env:LOCALAPPDATA\cv1touch\state\logs\cv1touchd.log"; throw 'the daemon is not running' }
          $p = Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=unins.log' -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { Get-Content unins.log; throw "uninstall exit $($p.ExitCode)" }
          # the uninstaller's exit code comes before its copy removes the last files
          $waited = 0
          while ((Test-Path $app) -and $waited -lt 20) { Start-Sleep 1; $waited++ }
          if (Test-Path $app) { throw 'files left behind' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').cv1touch) { throw 'Run entry left behind' }
          if (Get-Process cv1touchd -ErrorAction SilentlyContinue) { throw 'the daemon is still running' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv1touch-setup
          path: target/installer/cv1touch-setup-*.exe
          if-no-files-found: error
          retention-days: 14
  release:
    # A tag v* attaches the installer to its release (a draft, if none exists yet). The only job
    # that may write to the repository, and it runs nothing it built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cv1touch-setup
          path: setup
      - name: Attach to the release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes "See CHANGELOG.md."
          gh release upload "$TAG" setup/cv1touch-setup-*.exe --clobber
